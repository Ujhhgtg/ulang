[package]
name = "ulang"
version = "0.1.0"
edition = "2024"

[dependencies]
inkwell = { version = "0.9", features = ["llvm22-1-prefer-dynamic"] }
annotate-snippets = "0.12"
clap = { version = "4", features = ["derive"] }
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
